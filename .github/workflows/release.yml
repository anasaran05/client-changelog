name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      # Trusted publishing (OIDC) needs npm 11.5.1+; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      # No token: npm authenticates via the trusted publisher configured on npmjs.com.
      - run: npm publish --provenance --access public
